# Serve output/dashboard.html behind a password (it contains client numbers).
#   sudo apt install nginx apache2-utils
#   sudo htpasswd -c /etc/nginx/.mbos_htpasswd ibrahem
server {
    listen 80;
    server_name dashboard.example.com;          # your domain / subdomain
    root /opt/MB/output;
    location / {
        auth_basic "MB Control Room";
        auth_basic_user_file /etc/nginx/.mbos_htpasswd;
        try_files /dashboard.html =404;
    }
    location ~ \.(json|md)$ { deny all; }       # raw data stays private
}
# Then: sudo certbot --nginx -d dashboard.example.com   (HTTPS)
